<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>닥터빌 제안서 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@700;800&display=swap">
<style>
/* Layout: app shell = sticky input panel (left) + live brochure preview (right). Brochure = GDPlus-style editorial page, fixed brand colors. */
:root{
  --app-bg:#F2F5F9; --app-panel:#FFFFFF; --app-fg:#0E1B2A; --app-mute:#5B6B7B; --app-line:#D9E1EA;
  --app-accent:#0085FF; --app-accent-ink:#FFFFFF; --app-field:#F7F9FC; --app-warn-bg:#FFF6E5; --app-warn-fg:#7A4B00;
  --f-display:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-logo:"Poppins","Arial Black",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --app-bg:#0B1420; --app-panel:#121E2C; --app-fg:#E6EDF5; --app-mute:#9AAABB; --app-line:#25364A;
  --app-accent:#3BA2FF; --app-accent-ink:#04121F; --app-field:#0E1926; --app-warn-bg:#2A2110; --app-warn-fg:#F2C97A; color-scheme:dark}}
:root[data-theme="dark"]{
  --app-bg:#0B1420; --app-panel:#121E2C; --app-fg:#E6EDF5; --app-mute:#9AAABB; --app-line:#25364A;
  --app-accent:#3BA2FF; --app-accent-ink:#04121F; --app-field:#0E1926; --app-warn-bg:#2A2110; --app-warn-fg:#F2C97A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--app-bg);color:var(--app-fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--app-panel)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--app-panel);border-bottom:1px solid var(--app-line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.step{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--app-line);color:var(--app-mute)}
.step.on{border-color:var(--app-accent);color:var(--app-accent);font-weight:700}
.step.done{background:var(--app-accent);border-color:var(--app-accent);color:var(--app-accent-ink)}
.shell{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--app-panel);border:1px solid var(--app-line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:901px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 84px);overflow:auto}}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--app-accent);margin-bottom:6px;padding:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--app-mute);font-weight:500}
label.f b{color:#E5484D;font-weight:700}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],select,textarea{
  font:inherit;font-size:14px;color:var(--app-fg);background:var(--app-field);border:1px solid var(--app-line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:92px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--app-accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--app-fg);cursor:pointer}
.note{font-size:12px;background:var(--app-warn-bg);color:var(--app-warn-fg);border-radius:6px;padding:8px 10px;line-height:1.5}
.toggle{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer}
.toggle small{display:block;color:var(--app-mute);font-size:12px}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:6px;padding:11px 14px;cursor:pointer;border:1px solid var(--app-accent);background:var(--app-accent);color:var(--app-accent-ink);display:flex;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--app-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{font-size:12px;color:var(--app-mute);min-height:18px}
.status.err{color:#E5484D}
.err-msg{font-size:12px;color:#E5484D}
.preview-wrap{min-width:0;display:flex;flex-direction:column;gap:10px}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--app-mute)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--app-warn-bg);color:var(--app-warn-fg)}
.frame{border:1px solid var(--app-line);border-radius:10px;overflow:hidden;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#0E1B2A;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.logo-up{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--app-mute);flex-wrap:wrap}
.logo-up button{font:inherit;font-size:12px;background:none;border:1px solid var(--app-line);color:var(--app-fg);border-radius:6px;padding:4px 8px;cursor:pointer}
[hidden]{display:none!important}
.org{border:1px solid var(--app-line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--app-field);min-width:0}
.org-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.org-h button,.org .add{font:inherit;font-size:12px;background:none;border:1px solid var(--app-line);color:var(--app-accent);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.org-h button:disabled,.org .add:disabled{opacity:.5;cursor:default}
.org-st{margin:0;font-size:12px;color:var(--app-mute)}
.org-st.err{color:#E5484D}
.org h5{margin:6px 0 4px;font-size:12px;color:var(--app-accent);letter-spacing:.04em}
.org p{margin:0;font-size:13px}
.org ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.org li{font-size:13px;line-height:1.5}
.org li small{color:var(--app-mute)}
.org li a{color:var(--app-accent);font-size:12px;text-decoration:none}
.org .imp li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.org .chips{display:flex;flex-wrap:wrap;gap:4px}
.org .chips span{font-size:11px;border:1px solid var(--app-line);border-radius:999px;padding:1px 8px;background:var(--app-panel)}
.org .src{font-size:11px;color:var(--app-mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.org .src a{color:var(--app-mute)}
.org .addall{align-self:flex-start}
.access{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="bro-css">
/* ===== Brochure (exported as-is) ===== */
.bro{--navy:#001121;--blue:#0085FF;--ice:#E4EEF7;--ink:#001121;--mute:#55657A;--line:#D5E0EA;--mint:#12D6B0;--paper:#FFFFFF;
  --fd:"Bebas Neue","Impact","Arial Narrow",sans-serif;--fb:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fl:"Poppins","Arial Black",sans-serif;
  container-type:inline-size;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}

.bro .hero .in{position:relative;padding-block:clamp(56px,9cqi,120px) clamp(48px,7cqi,96px);display:flex;flex-direction:column;gap:22px}

.bro section{padding-block:clamp(64px,9cqi,112px)}
.bro .label{font-family:var(--fd);font-weight:400;color:var(--blue);font-size:clamp(56px,9.5cqi,110px);line-height:.88;text-transform:lowercase;letter-spacing:.005em}
.bro .label-sub{font-size:clamp(18px,2cqi,22px);font-weight:700;margin-top:14px;text-wrap:balance}

.bro .req{background:var(--ice);padding:28px;display:flex;flex-direction:column;gap:14px}

.bro .req ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:r}
.bro .req li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:10px;font-weight:500}
.bro .req li::before{content:counter(r,decimal-leading-zero);font-family:var(--fd);font-size:24px;line-height:1.1;color:var(--blue)}
.bro .tags{display:flex;gap:6px;flex-wrap:wrap}
.bro .tag{font-size:12px;font-weight:700;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px}
.bro .about{background:var(--ice)}
.bro .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-top:44px;background:var(--line);border:1px solid var(--line)}
.bro .stat{background:#fff;padding:26px 22px}
.bro .stat b{display:block;font-family:var(--fd);font-weight:400;font-size:clamp(40px,5.2cqi,64px);line-height:1;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.bro .stat span{color:var(--mute);font-size:14px;font-weight:500}
.bro .demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3cqi,40px);margin-top:36px}
.bro .demo h4{margin:0 0 12px;font-size:15px}
.bro .bar{display:grid;grid-template-columns:72px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.bro .bar i{display:block;height:10px;background:#fff;position:relative}
.bro .bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--blue)}
.bro .bar em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bro .svc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4cqi,56px);padding-block:48px;border-top:1px solid var(--line)}
.bro .svc:first-of-type{margin-top:44px}
.bro .svc .no{font-family:var(--fd);font-size:20px;letter-spacing:.08em;color:var(--blue)}
.bro .svc h3{font-size:clamp(26px,3.2cqi,36px);font-weight:900;line-height:1.25;margin-top:2px}
.bro .svc .sub{color:var(--mute);margin-top:8px}
.bro .why{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.bro .why div{display:grid;grid-template-columns:4px 1fr;gap:14px}
.bro .why div::before{content:"";background:var(--line)}

.bro .why p{color:var(--mute);font-size:15px}
.bro .items{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.bro .items span{font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:999px}

.bro .fit{background:var(--navy);color:#fff;padding:30px;display:flex;flex-direction:column;gap:16px;align-self:start}
.bro .fit .k{font-family:var(--fd);font-size:20px;letter-spacing:.06em;color:#6FB8FF}
.bro .fit h4{margin:0;font-size:21px;line-height:1.45;font-weight:700;text-wrap:balance}
.bro .fit ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bro .fit li{display:grid;grid-template-columns:18px 1fr;gap:8px;color:#D3DEEA;font-size:15px}
.bro .fit li::before{content:"";width:8px;height:8px;margin-top:9px;background:var(--mint)}
.bro .band{background:var(--navy);color:#fff;padding-block:clamp(56px,7cqi,88px);position:relative;overflow:hidden}
.bro .band::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 120% at 0% 50%,rgba(0,133,255,.28),transparent 70%)}
.bro .band .in{position:relative}
.bro .band p{font-size:clamp(22px,3cqi,34px);font-weight:900;line-height:1.45;max-width:26em;text-wrap:balance}
.bro .band small{display:block;margin-top:14px;color:#9FB3C8;font-size:15px}
.bro .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2cqi,24px);margin-top:44px}
.bro .flow div{border-top:2px solid var(--ink);padding-top:16px}
.bro .flow b{font-family:var(--fd);font-weight:400;font-size:52px;line-height:1;color:var(--blue)}
.bro .flow h4{margin:8px 0 6px;font-size:18px}

@container (max-width:420px){.bro .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<header class="topbar">
  <h1><span id="appLogo"></span>제안서 생성기</h1>
  <div class="steps" aria-label="진행 단계">
    <span class="step on" id="st1">1 입력</span><span class="step" id="st2">2 웹브로셔</span><span class="step" id="st3">3 PPT 16:9</span>
  </div>
</header>

<div class="shell">
  <form class="panel" id="form" novalidate>
    <fieldset>
      <legend>제안담당자</legend>
      <div class="row2">
        <label class="f">이름 <b>*</b><input type="text" id="mName" required autocomplete="name"></label>
        <label class="f">직함<input type="text" id="mTitle"></label>
      </div>
      <label class="f">소속<input type="text" id="mOrg"></label>
      <div class="row2">
        <label class="f">이메일 <b>*</b><input type="email" id="mEmail" required></label>
        <label class="f">연락처<input type="tel" id="mPhone"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>제안처</legend>
      <label class="f">기관명 <b>*</b><input type="text" id="cName" required placeholder="예: 대웅제약"></label>
      <section class="org" id="orgBox" aria-live="polite">
        <div class="org-h"><b>기관 최신 정보</b><button type="button" id="orgBtn">조회</button></div>
        <p class="org-st" id="orgState">기관명을 입력하면 최근 뉴스·동향을 찾아 요약합니다.</p>
        <div id="orgBody"></div>
      </section>
      <div class="row2">
        <label class="f">유형<select id="cType">
          <option>제약사</option><option>의료기기사</option><option>학회</option><option>병원</option><option>기타</option>
        </select></label>
        <label class="f">제안일<input type="date" id="pDate"></label>
      </div>
      <label class="f">수신 부서 · 담당자<input type="text" id="cDept" placeholder="예: 마케팅본부 PM팀 김OO 과장"></label>
    </fieldset>

    <fieldset>
      <legend>추가 요구사항</legend>
      <div class="checks" id="svcChecks">
        <label><input type="checkbox" value="platform" id="svPlatform"> 플랫폼 광고</label>
        <label><input type="checkbox" value="webinar" id="svWebinar"> 웹 세미나</label>
        <label><input type="checkbox" value="conference" id="svConference"> 온/오프라인 컨퍼런스</label>
      </div>
      <label class="f">타겟 진료과<input type="text" id="target" placeholder="예: 내과, 가정의학과"></label>
      <label class="f">요구사항 · 제안 목적 (RFP·메일·통화 메모 원문 붙여넣기 가능)<textarea id="reqs" rows="7"></textarea></label>
      <label class="toggle"><input type="checkbox" id="useAI" checked>
        <span>AI로 요구사항 분석 · 맞춤 문구 작성<small>원문에서 목표·타겟·KPI를 뽑아 요구사항별 대응 방안을 만들고, 제목·제안 배경·서비스별 포인트를 새로 씁니다. 끄면 기본 문구로 만듭니다.</small></span></label>
      <label class="toggle"><input type="checkbox" id="svcAuto" checked>
        <span>분석 결과로 서비스 추천 반영<small>요구사항에 맞는 서비스를 AI가 추천하면 선택 서비스에 더합니다. 서비스를 하나도 고르지 않아도 됩니다.</small></span></label>
      <label class="toggle"><input type="checkbox" id="incPrice">
        <span>광고 단가 포함<small>광고제안서 Price Summary 기준 단가표를 웹브로셔·PPT에 넣습니다. 외부 발송 전 팀장·사업부장 승인을 받으세요.</small></span></label>
      <div class="logo-up">로고: <span id="logoState">기본 로고</span>
        <button type="button" id="logoBtn">로고 파일 교체</button><button type="button" id="logoReset" hidden>기본으로</button>
        <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
      </div>
      <p class="note">계약 조건, 단가, 내부 전략, 개인정보는 사내 지침에 따라 팀장·사업부장 승인 후 입력하세요.</p>
    </fieldset>

    <div class="access" id="accessBox" hidden>
      <label class="f">팀 접근 코드<input type="password" id="accessCode" autocomplete="off" spellcheck="false"></label>
      <button type="button" class="btn ghost" id="accessOk" style="padding:8px 10px">확인</button>
    </div>

    <div class="actions">
      <p class="err-msg" id="err" hidden></p>
      <button class="btn" type="submit" id="genBtn">웹브로셔 생성</button>
      <div class="btnrow">
        <button class="btn ghost" type="button" id="htmlBtn" disabled>HTML 저장</button>
        <button class="btn ghost" type="button" id="pptBtn" disabled>PPT 생성 (16:9)</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </form>

  <div class="preview-wrap">
    <div class="preview-head"><span id="pvLabel">웹브로셔 미리보기</span><span class="badge" id="sampleBadge">예시 입력값</span></div>
    <div class="frame"><div id="preview"></div></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function iconPNG(){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=192;c.getContext("2d").drawImage(im,0,0,192,192);res(c.toDataURL("image/png"))};im.onerror=()=>res(null);
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICON_SVG.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" '))})}
async function logoPNG(){if(!customLogo)return null;return new Promise(res=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/im.naturalWidth),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res({data:c.toDataURL("image/png"),ar:c.width/c.height})};im.onerror=()=>res(null);im.src=customLogo.url})}
